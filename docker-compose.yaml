services:
  keycloak-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: ${KEYCLOAK_DB_CONTAINER_NAME}
    restart: always
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - keycloak-test-network

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: ${KEYCLOAK_CONTAINER_NAME}
    restart: always
    depends_on:
      - keycloak-db
    ports:
      - "8080:8080"
    environment:
    # keycloakで予約されている環境変数
      # 使用するデータベースの種類
      KC_DB: postgres
      # JDBC接続:postgresql用JDBCドライバ://ホスト名:ポート番号/データベース名
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      # データベースのユーザー名とパスワード
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # 初回設定の一時的な管理ユーザー
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    command:
      - start-dev
    networks:
      - keycloak-test-network

volumes:
  keycloak-db-data:

networks:
  keycloak-test-network: